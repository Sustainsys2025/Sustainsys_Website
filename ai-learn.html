<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/sustainsys-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SustainsysAI - AI-Powered Learning Platform. Master new skills with personalized AI-driven education." />
    <meta name="theme-color" content="#0891b2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Sustainsys - AI Academy | AI-Powered Learning Platform</title>
    <script type="module" crossorigin src="./ai-learn-assets/index-C5f5ZBA_.js"></script>
    <link rel="stylesheet" crossorigin href="./ai-learn-assets/index-Dll_YlUf.css">
    <style>
        /* Full-width layout */
        .container { max-width: 100%; padding: 0 4rem; }
        @media (max-width: 768px) { .container { padding: 0 1rem; } }

        /* ── Publications Dropdown ──────────────────────── */
        .pub-dropdown-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .pub-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #1e293b;
            background: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }
        .pub-btn:hover {
            background: #f1f5f9;
            color: #0891b2;
        }
        .pub-btn svg {
            width: 16px; height: 16px;
            transition: transform 0.2s ease;
        }
        .pub-dropdown-wrap:hover .pub-btn svg {
            transform: rotate(180deg);
        }
        .pub-arrow {
            width: 16px; height: 16px;
            opacity: 0.5;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .pub-dropdown-wrap:hover .pub-arrow {
            transform: rotate(180deg);
            opacity: 1;
        }
        .pub-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            min-width: 320px;
            padding: 0.5rem;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.10), 0 4px 16px rgba(0,0,0,0.06);
            z-index: 1000;
            margin-top: 4px;
        }
        .pub-dropdown::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 12px; height: 12px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            border-left: 1px solid #e2e8f0;
        }
        .pub-dropdown-wrap:hover .pub-dropdown {
            display: block;
            animation: pubFadeIn 0.25s ease forwards;
        }
        @keyframes pubFadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(6px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .pub-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            text-decoration: none;
            transition: background 0.2s ease;
        }
        .pub-card:hover {
            background: #f1f5f9;
        }
        .pub-card-icon {
            width: 40px; height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #0891b2, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .pub-card-icon svg {
            width: 20px; height: 20px;
            color: #fff;
        }
        .pub-card-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .pub-card-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .pub-card-badge {
            font-size: 0.6rem;
            padding: 1px 6px;
            border-radius: 4px;
            background: rgba(8,145,178,0.1);
            color: #0891b2;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .pub-card-desc {
            font-size: 0.75rem;
            color: #64748b;
        }
        .pub-card-arrow {
            margin-left: auto;
            color: #cbd5e1;
            font-size: 1.2rem;
            transition: color 0.2s ease;
        }
        .pub-card:hover .pub-card-arrow {
            color: #0891b2;
        }

        /* Dark mode support */
        .dark .pub-btn { color: #e2e8f0; }
        .dark .pub-btn:hover { background: #1e293b; color: #22d3ee; }
        .dark .pub-dropdown { background: #0f172a; border-color: #1e293b; }
        .dark .pub-dropdown::before { background: #0f172a; border-color: #1e293b; }
        .dark .pub-card:hover { background: #1e293b; }
        .dark .pub-card-title { color: #f1f5f9; }
        .dark .pub-card-desc { color: #94a3b8; }
        .dark .pub-card-arrow { color: #334155; }
        .dark .pub-card:hover .pub-card-arrow { color: #22d3ee; }

        /* Mobile Publications section */
        .pub-mobile-section {
            margin: 0.25rem 0;
        }
        .pub-mobile-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            background: none;
            border: none;
            cursor: pointer;
        }
        .pub-mobile-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0.625rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #475569;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .pub-mobile-link:hover {
            background: #f1f5f9;
            color: #0891b2;
        }
        .pub-mobile-sub {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0.5rem 1rem 0.5rem 2.25rem;
            font-size: 0.82rem;
            color: #64748b;
            text-decoration: none;
            transition: all 0.2s ease;
            border-radius: 6px;
        }
        .pub-mobile-sub:hover {
            background: #f1f5f9;
            color: #0891b2;
        }
        .pub-mobile-sub .pub-mobile-badge {
            font-size: 0.6rem;
            font-weight: 700;
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
            background: rgba(8, 145, 178, 0.1);
            color: #0891b2;
        }
        .dark .pub-mobile-link { color: #94a3b8; }
        .dark .pub-mobile-link:hover { background: #1e293b; color: #22d3ee; }
        .dark .pub-mobile-sub { color: #64748b; }
        .dark .pub-mobile-sub:hover { background: #1e293b; color: #22d3ee; }
    </style>
  </head>
  <body class="min-h-screen bg-[#f8fafc] text-dark-900 dark:bg-dark-950 dark:text-dark-50 antialiased">
    <div id="root"></div>

    <!-- ── Inject Publications dropdown into React nav ──────── -->
    <script>
    (function injectPublications() {
        const MAX_TRIES = 50;
        let tries = 0;

        function inject() {
            tries++;

            // Find the desktop nav links container
            const desktopNav = document.querySelector('nav .hidden.md\\:flex.items-center.gap-1');
            if (!desktopNav) {
                if (tries < MAX_TRIES) { setTimeout(inject, 150); }
                return;
            }

            // Don't inject twice
            if (document.querySelector('.pub-dropdown-wrap')) return;

            // ── Desktop: Publications dropdown ──
            const pubWrap = document.createElement('div');
            pubWrap.className = 'pub-dropdown-wrap';
            pubWrap.style.paddingBottom = '0.5rem';
            pubWrap.style.marginBottom = '-0.5rem';
            pubWrap.innerHTML = `
                <button class="pub-btn" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                    Publications
                    <svg class="pub-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="pub-dropdown">
                    <a href="publications/MS_Graph_API_Python_Flask_Guide (1).html" class="pub-card">
                        <span class="pub-card-icon" style="background: linear-gradient(135deg, #0078d4, #50e6ff);">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                        </span>
                        <span class="pub-card-text">
                            <span class="pub-card-title">MS Graph API — Python Flask <span class="pub-card-badge">New</span></span>
                            <span class="pub-card-desc">Integrate Microsoft 365 services with Python Flask and MSAL</span>
                        </span>
                        <span class="pub-card-arrow">&rsaquo;</span>
                    </a>
                    <a href="publications/Copilot_Studio_Prompt_Libraries_Guide.html" class="pub-card">
                        <span class="pub-card-icon" style="background: linear-gradient(135deg, #6b2fa0, #a855f7);">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                        </span>
                        <span class="pub-card-text">
                            <span class="pub-card-title">Copilot Studio & Prompt Libraries <span class="pub-card-badge">New</span></span>
                            <span class="pub-card-desc">Build AI agents with Microsoft Copilot Studio and prompt libraries</span>
                        </span>
                        <span class="pub-card-arrow">&rsaquo;</span>
                    </a>
                    <a href="publications/nl2sql-guide.html" class="pub-card">
                        <span class="pub-card-icon" style="background: linear-gradient(135deg, #0891b2, #059669);">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
                        </span>
                        <span class="pub-card-text">
                            <span class="pub-card-title">NL2SQL Analytics Pipeline <span class="pub-card-badge">New</span></span>
                            <span class="pub-card-desc">Natural language to SQL — from query parsing to enterprise deployment</span>
                        </span>
                        <span class="pub-card-arrow">&rsaquo;</span>
                    </a>
                    <a href="publications/multi-agent-orchestrator-guide.html" class="pub-card">
                        <span class="pub-card-icon" style="background: linear-gradient(135deg, #0891b2, #7c3aed);">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                        </span>
                        <span class="pub-card-text">
                            <span class="pub-card-title">Multi-Agent Orchestration <span class="pub-card-badge">New</span></span>
                            <span class="pub-card-desc">Building multi-agent systems with LangChain orchestration</span>
                        </span>
                        <span class="pub-card-arrow">&rsaquo;</span>
                    </a>
                    <a href="publications/ai-agent-guide-v2.html" class="pub-card">
                        <span class="pub-card-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6V2H8"/><path d="m8 18-4 4V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2Z"/><path d="M2 12h2"/><path d="M9 11v2"/><path d="M15 11v2"/><path d="M12 15a2 2 0 0 0 2-2H10a2 2 0 0 0 2 2Z"/></svg>
                        </span>
                        <span class="pub-card-text">
                            <span class="pub-card-title">Local AI Agent Build Guide</span>
                            <span class="pub-card-desc">Hands-on guide to building AI agents with MCP, ReAct & tools</span>
                        </span>
                        <span class="pub-card-arrow">&rsaquo;</span>
                    </a>
                    <a href="publications/pytorch-guide.html" class="pub-card">
                        <span class="pub-card-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
                        </span>
                        <span class="pub-card-text">
                            <span class="pub-card-title">PyTorch from Scratch <span class="pub-card-badge">New</span></span>
                            <span class="pub-card-desc">Complete guide to PyTorch fundamentals, tensors & neural networks</span>
                        </span>
                        <span class="pub-card-arrow">&rsaquo;</span>
                    </a>
                    <a href="publications/rag-pipeline-guide.html" class="pub-card">
                        <span class="pub-card-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M8 7h6"/><path d="M8 11h8"/></svg>
                        </span>
                        <span class="pub-card-text">
                            <span class="pub-card-title">Building a Local RAG Pipeline <span class="pub-card-badge">New</span></span>
                            <span class="pub-card-desc">End-to-end guide to building retrieval-augmented generation pipelines</span>
                        </span>
                        <span class="pub-card-arrow">&rsaquo;</span>
                    </a>
                    <a href="publications/ai-architect-curriculum.html" class="pub-card">
                        <span class="pub-card-icon" style="background: linear-gradient(135deg, #7c3aed, #db2777);">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                        </span>
                        <span class="pub-card-text">
                            <span class="pub-card-title">AI Architect Curriculum <span class="pub-card-badge">New</span></span>
                            <span class="pub-card-desc">7-module mastery path covering LLMs, agents, RAG & enterprise AI</span>
                        </span>
                        <span class="pub-card-arrow">&rsaquo;</span>
                    </a>
                </div>
            `;

            desktopNav.appendChild(pubWrap);

            // ── Mobile: Add Publications with all links to mobile menu ──
            const observer = new MutationObserver(function() {
                // Try multiple selectors to find the mobile menu
                const mobileMenu = document.querySelector('nav .md\\:hidden.border-t .px-4.py-3.space-y-1')
                    || document.querySelector('nav [class*="md:hidden"] [class*="space-y"]')
                    || document.querySelector('nav [class*="mobile"]');
                if (mobileMenu && !mobileMenu.querySelector('.pub-mobile-section')) {
                    const section = document.createElement('div');
                    section.className = 'pub-mobile-section';
                    section.innerHTML = `
                        <a href="#" class="pub-mobile-link" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none';return false;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                            Publications &#9662;
                        </a>
                        <div style="display:none;">
                            <a href="publications/MS_Graph_API_Python_Flask_Guide (1).html" class="pub-mobile-sub">MS Graph API — Python Flask <span class="pub-mobile-badge">New</span></a>
                            <a href="publications/Copilot_Studio_Prompt_Libraries_Guide.html" class="pub-mobile-sub">Copilot Studio & Prompt Libraries <span class="pub-mobile-badge">New</span></a>
                            <a href="publications/nl2sql-guide.html" class="pub-mobile-sub">NL2SQL Analytics Pipeline <span class="pub-mobile-badge">New</span></a>
                            <a href="publications/multi-agent-orchestrator-guide.html" class="pub-mobile-sub">Multi-Agent Orchestration <span class="pub-mobile-badge">New</span></a>
                            <a href="publications/ai-agent-guide-v2.html" class="pub-mobile-sub">Local AI Agent Build Guide</a>
                            <a href="publications/pytorch-guide.html" class="pub-mobile-sub">PyTorch from Scratch <span class="pub-mobile-badge">New</span></a>
                            <a href="publications/rag-pipeline-guide.html" class="pub-mobile-sub">Building a Local RAG Pipeline <span class="pub-mobile-badge">New</span></a>
                            <a href="publications/ai-architect-curriculum.html" class="pub-mobile-sub">AI Architect Curriculum <span class="pub-mobile-badge">New</span></a>
                        </div>
                    `;
                    const authSection = mobileMenu.querySelector('.flex.flex-col.gap-2.pt-2')
                        || mobileMenu.querySelector('[class*="flex"][class*="col"][class*="gap"]');
                    if (authSection) {
                        mobileMenu.insertBefore(section, authSection);
                    } else {
                        mobileMenu.appendChild(section);
                    }
                }
            });
            observer.observe(document.querySelector('nav'), { childList: true, subtree: true });
        }

        // Start injection after DOM + React render
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => setTimeout(inject, 200));
        } else {
            setTimeout(inject, 200);
        }
    })();
    </script>
  </body>
</html>
