    <script>
    (function supaAuthOverlay() {
      /* Course IDs matching the 3 certification programs */
      const CERTIFICATIONS_URL = 'courses/index.html';

      let overlay = null;

      function getHash() { return window.location.hash.replace('#/', '').replace('#', ''); }

      function showOverlay(mode) {
        removeOverlay();
        // Hide React SPA with a <style> tag — CSS !important beats any React inline style changes
        const root = document.getElementById('root');
        if (root) root.style.display = 'none';
        if (!document.getElementById('supaHideRoot')) {
          const s = document.createElement('style');
          s.id = 'supaHideRoot';
          s.textContent = '#root { display: none !important; }';
          document.head.appendChild(s);
        }

        overlay = document.createElement('div');
        overlay.className = 'supa-auth-overlay';
        overlay.id = 'supaAuthOverlay';

        if (mode === 'login') {
          overlay.innerHTML = `
            <div class="supa-auth-card">
              <div class="auth-logo">
                <img src="assets/logo_only.png" alt="SustainSys">
                <span>Sustain<b>Sys</b> AI Academy</span>
              </div>
              <h2>Welcome Back</h2>
              <p class="auth-subtitle">Sign in to access your certifications</p>
              <div class="auth-error" id="authError"></div>
              <div class="auth-success" id="authSuccess"></div>
              <form id="supaLoginForm" autocomplete="on">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" name="email" placeholder="you@example.com" required autocomplete="email">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" name="password" placeholder="Your password" required autocomplete="current-password">
                <a href="#" class="auth-forgot" id="forgotLink">Forgot password?</a>
                <button type="submit" class="auth-btn" id="loginBtn">Sign In</button>
              </form>
              <div class="auth-switch">
                Don't have an account? <a id="goRegister">Create one</a>
              </div>
            </div>`;
        } else if (mode === 'register') {
          overlay.innerHTML = `
            <div class="supa-auth-card">
              <div class="auth-logo">
                <img src="assets/logo_only.png" alt="SustainSys">
                <span>Sustain<b>Sys</b> AI Academy</span>
              </div>
              <h2>Create Account</h2>
              <p class="auth-subtitle">Join the academy and start learning</p>
              <div class="auth-error" id="authError"></div>
              <div class="auth-success" id="authSuccess"></div>
              <form id="supaRegisterForm" autocomplete="on">
                <div class="name-row">
                  <div>
                    <label for="regFirstName">First Name</label>
                    <input type="text" id="regFirstName" name="given-name" placeholder="First name" required autocomplete="given-name">
                  </div>
                  <div>
                    <label for="regLastName">Last Name</label>
                    <input type="text" id="regLastName" name="family-name" placeholder="Last name" required autocomplete="family-name">
                  </div>
                </div>
                <label for="regEmail">Email</label>
                <input type="email" id="regEmail" name="email" placeholder="you@example.com" required autocomplete="email">
                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" name="new-password" placeholder="Min 8 chars, 1 uppercase, 1 number" required autocomplete="new-password" minlength="8">
                <label for="regConfirm">Confirm Password</label>
                <input type="password" id="regConfirm" name="confirm-password" placeholder="Confirm your password" required autocomplete="new-password">
                <button type="submit" class="auth-btn" id="registerBtn">Create Account</button>
              </form>
              <div class="auth-switch">
                Already have an account? <a id="goLogin">Sign in</a>
              </div>
            </div>`;
        } else if (mode === 'forgot') {
          overlay.innerHTML = `
            <div class="supa-auth-card">
              <div class="auth-logo">
                <img src="assets/logo_only.png" alt="SustainSys">
                <span>Sustain<b>Sys</b> AI Academy</span>
              </div>
              <h2>Reset Password</h2>
              <p class="auth-subtitle">We'll send you a link to reset your password</p>
              <div class="auth-error" id="authError"></div>
              <div class="auth-success" id="authSuccess"></div>
              <form id="supaForgotForm" autocomplete="on">
                <label for="forgotEmail">Email</label>
                <input type="email" id="forgotEmail" name="email" placeholder="you@example.com" required autocomplete="email">
                <button type="submit" class="auth-btn" id="forgotBtn">Send Reset Link</button>
              </form>
              <div class="auth-switch">
                <a id="backToLogin">Back to Sign In</a>
              </div>
            </div>`;
        }

        document.body.appendChild(overlay);
        bindEvents(mode);
      }

      function removeOverlay() {
        const el = document.getElementById('supaAuthOverlay');
        if (el) el.remove();
        overlay = null;
      }

      function showRoot() {
        const root = document.getElementById('root');
        if (root) root.style.display = '';
        const hider = document.getElementById('supaHideRoot');
        if (hider) hider.remove();
      }

      function showError(msg) {
        const el = document.getElementById('authError');
        if (el) { el.textContent = msg; el.style.display = 'block'; }
        const s = document.getElementById('authSuccess');
        if (s) s.style.display = 'none';
      }

      function showSuccess(msg) {
        const el = document.getElementById('authSuccess');
        if (el) { el.textContent = msg; el.style.display = 'block'; }
        const e = document.getElementById('authError');
        if (e) e.style.display = 'none';
      }

      function setLoading(btnId, loading) {
        const btn = document.getElementById(btnId);
        if (!btn) return;
        btn.disabled = loading;
        btn.textContent = loading ? 'Please wait...' : btn.dataset.label || btn.textContent;
      }

      function bindEvents(mode) {
        if (mode === 'login') {
          const form = document.getElementById('supaLoginForm');
          const btn = document.getElementById('loginBtn');
          btn.dataset.label = 'Sign In';

          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) { showError('Please fill in all fields.'); return; }

            setLoading('loginBtn', true);
            try {
              await supaSignIn({ email, password });
              showSuccess('Signed in! Redirecting...');
              setTimeout(() => { window.location.href = CERTIFICATIONS_URL; }, 600);
            } catch (err) {
              showError(err.message || 'Invalid email or password.');
              setLoading('loginBtn', false);
            }
          });

          document.getElementById('goRegister').addEventListener('click', (e) => {
            e.preventDefault();
            window.location.hash = '#/register';
          });

          document.getElementById('forgotLink').addEventListener('click', (e) => {
            e.preventDefault();
            window.location.hash = '#/forgot-password';
          });

        } else if (mode === 'register') {
          const form = document.getElementById('supaRegisterForm');
          const btn = document.getElementById('registerBtn');
          btn.dataset.label = 'Create Account';

          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const firstName = document.getElementById('regFirstName').value.trim();
            const lastName = document.getElementById('regLastName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;

            if (!firstName || !lastName || !email || !password) {
              showError('Please fill in all fields.'); return;
            }
            if (firstName.length < 2 || lastName.length < 2) {
              showError('Names must be at least 2 characters.'); return;
            }
            if (password.length < 8) {
              showError('Password must be at least 8 characters.'); return;
            }
            if (!/[A-Z]/.test(password)) {
              showError('Password must contain at least one uppercase letter.'); return;
            }
            if (!/[0-9]/.test(password)) {
              showError('Password must contain at least one number.'); return;
            }
            if (password !== confirm) {
              showError('Passwords do not match.'); return;
            }

            setLoading('registerBtn', true);
            try {
              const data = await supaSignUp({ email, password, firstName, lastName });
              if (data.user && data.session) {
                showSuccess('Account created! Redirecting...');
                setTimeout(() => { window.location.href = CERTIFICATIONS_URL; }, 600);
              } else if (data.user && !data.session) {
                showSuccess('Account created! Please check your email to confirm, then sign in.');
                setLoading('registerBtn', false);
              }
            } catch (err) {
              showError(err.message || 'Registration failed. Please try again.');
              setLoading('registerBtn', false);
            }
          });

          document.getElementById('goLogin').addEventListener('click', (e) => {
            e.preventDefault();
            window.location.hash = '#/login';
          });

        } else if (mode === 'forgot') {
          const form = document.getElementById('supaForgotForm');
          const btn = document.getElementById('forgotBtn');
          btn.dataset.label = 'Send Reset Link';

          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value.trim();
            if (!email) { showError('Please enter your email.'); return; }

            setLoading('forgotBtn', true);
            try {
              await supaForgotPassword(email);
              showSuccess('Reset link sent! Check your email.');
              setLoading('forgotBtn', false);
            } catch (err) {
              showError(err.message || 'Failed to send reset email.');
              setLoading('forgotBtn', false);
            }
          });

          document.getElementById('backToLogin').addEventListener('click', (e) => {
            e.preventDefault();
            window.location.hash = '#/login';
          });
        }
      }

      /* ── Route handler ── */
      function handleRoute() {
        const hash = getHash();

        if (hash === 'login' || hash === 'register' || hash === 'forgot-password') {
          // Show overlay immediately (don't wait for session check)
          if (hash === 'login') showOverlay('login');
          else if (hash === 'register') showOverlay('register');
          else if (hash === 'forgot-password') showOverlay('forgot');

          // Then check session in background — redirect if already logged in
          if (typeof supaGetSession === 'function') {
            supaGetSession().then(session => {
              if (session) window.location.href = CERTIFICATIONS_URL;
            }).catch(() => {});
          }
        } else {
          removeOverlay();
          showRoot();
        }
      }

      // Expose handleRoute globally so replaced SPA chunks can call it
      window.handleRoute = handleRoute;

      // Listen for hash changes
      window.addEventListener('hashchange', handleRoute);

      // Run immediately — don't wait for load event to beat the React SPA
      handleRoute();

      // Also re-check after load in case Supabase SDK wasn't ready
      window.addEventListener('load', () => { setTimeout(handleRoute, 50); });

      // ── FIX: React Router (HashRouter) may use pushState/replaceState internally,
      // which does NOT fire "hashchange" events. Poll the hash every 100ms to catch
      // SPA-initiated navigations that bypass our hashchange listener. ──
      let _lastHash = getHash();
      setInterval(() => {
        const h = getHash();
        if (h !== _lastHash) {
          _lastHash = h;
          handleRoute();
        }
      }, 100);

      // ── FIX: Intercept clicks on SPA buttons/links that navigate to auth routes.
      // Uses capture phase to fire before React's synthetic event system.
      // Forces a full page reload so the inline <head> hider + handleRoute() both run fresh. ──
      document.addEventListener('click', function(e) {
        const link = e.target.closest('a[href*="#/login"], a[href*="#/register"], a[href*="#/forgot-password"], button');
        if (!link) return;

        // Check <a> tags with auth route hrefs
        const href = link.getAttribute('href') || '';
        if (href.includes('#/login') || href.includes('#/register') || href.includes('#/forgot-password')) {
          e.preventDefault();
          e.stopPropagation();
          // Navigate and reload to ensure clean overlay display
          window.location.hash = '#/' + href.split('#/')[1];
          handleRoute();
          return;
        }

        // Check buttons whose text/aria suggests auth navigation
        if (link.tagName === 'BUTTON' || link.tagName === 'A') {
          const text = (link.textContent || '').toLowerCase().trim();
          if (text === 'get started' || text === 'sign in' || text === 'log in' || text === 'register' || text === 'sign up') {
            // Wait a tick for the SPA to update the hash, then force our handler
            setTimeout(() => {
              const h = getHash();
              if (h === 'login' || h === 'register' || h === 'forgot-password') {
                _lastHash = h;
                handleRoute();
              }
            }, 50);
          }
        }
      }, true);

      // MutationObserver: if React renders auth pages while our overlay is up, keep #root hidden
      const rootEl = document.getElementById('root');
      if (rootEl) {
        new MutationObserver(() => {
          const h = getHash();
          if ((h === 'login' || h === 'register' || h === 'forgot-password') && !document.getElementById('supaHideRoot')) {
            const s = document.createElement('style');
            s.id = 'supaHideRoot';
            s.textContent = '#root { display: none !important; }';
            document.head.appendChild(s);
          }
        }).observe(rootEl, { childList: true, subtree: true });
      }
    })();
    </script>
